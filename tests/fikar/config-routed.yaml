# Plano, routed instance (KAN-514). Difficulty routing with Katanemo's hosted
# Plano-Orchestrator (no llm_routing_model override, so no local Ollama); only
# chat-backend's user-facing answer uses this instance. Everything else goes to
# the pinned instance (config-pinned.yaml), which has no routing_preferences.
#
# Keys are $ENV at render time. base_url must be a literal; a path on it
# replaces the provider's default path, so the Foundry entries spell out /openai/v1.
version: v0.4.0

listeners:
  - type: model
    name: routed
    address: 0.0.0.0
    port: 12000
    max_retries: 3

model_providers:
  - model: azure_openai/gpt-4.1-mini
    access_key: $AZURE_OPENAI_API_KEY
    base_url: https://fikar-openai.openai.azure.com
    default: true
  - model: azure_openai/gpt-4o
    access_key: $AZURE_OPENAI_API_KEY
    base_url: https://fikar-openai.openai.azure.com
  - model: azure_openai/gpt-5.6-luna
    access_key: $AZURE_OPENAI_API_KEY
    base_url: https://fikar-openai.openai.azure.com
  - model: azure_openai/gpt-5.6-terra
    access_key: $AZURE_OPENAI_API_KEY
    base_url: https://fikar-openai.openai.azure.com
  - model: azure_openai/gpt-6-astra
    access_key: $AZURE_OPENAI_API_KEY
    base_url: https://fikar-openai.openai.azure.com
  # Served on /v1/embeddings only (KAN-529). That handler never consults the
  # router, and no routing tier lists this model, so chat cannot land on it.
  - model: azure_openai/text-embedding-3-small
    access_key: $AZURE_OPENAI_API_KEY
    base_url: https://fikar-openai.openai.azure.com
  - model: foundry/grok-4.6
    provider_interface: openai
    access_key: $AZURE_FOUNDRY_API_KEY
    base_url: https://ranawaqas-0762-resource.openai.azure.com/openai/v1
  - model: foundry/DeepSeek-V4-Flash-0731
    provider_interface: openai
    access_key: $AZURE_FOUNDRY_API_KEY
    base_url: https://ranawaqas-0762-resource.openai.azure.com/openai/v1

# Four difficulty tiers. Order inside each list is primary then fallbacks on 429/5xx.
# Placement is by capability as understood on 2026-10-08 (NOTES.md in experiments/plano).
routing_preferences:
  - name: quick simple
    description: >-
      Greetings, one-line factual questions, short rewrites, yes/no checks and anything
      a small fast model answers well. Nothing that needs multi-step reasoning.
    models:
      - azure_openai/gpt-4.1-mini
      - foundry/DeepSeek-V4-Flash-0731
  - name: general assistance
    description: >-
      Everyday writing and explanation: summaries, emails, comparisons, how-to answers,
      light analysis where accuracy matters more than speed but no deep reasoning is needed.
    models:
      - azure_openai/gpt-5.6-luna
      - azure_openai/gpt-4o
  - name: hard reasoning
    description: >-
      Multi-step logic, math, planning with constraints, tricky edge cases, anything
      where a wrong shortcut produces a confidently wrong answer.
    models:
      - azure_openai/gpt-6-astra
      - azure_openai/gpt-5.6-terra
      - foundry/grok-4.6
  - name: programming
    description: >-
      Writing, reviewing or debugging code, stack traces, architecture questions,
      regexes, SQL, anything with a code block in the answer.
    models:
      - azure_openai/gpt-6-astra
      - azure_openai/gpt-5.6-terra

tracing:
  random_sampling: 100
  opentracing_grpc_endpoint: http://jaeger:4317
  # X-Fikar-Org: validated org label on the token counters and plano.org on spans,
  # stripped before the provider (Kapture-AI/plano patch, KAN-485).
  attribution_header: x-fikar-org
  span_attributes:
    header_prefixes:
      - x-fikar-
