# Builds on every merge to main and pushes to the shared fikar registry fikaracr.azurecr.io as
# <name>:sha-<short commit> and <name>:latest (fikar-infra, templates/build-push.yml). Sign-in is
# passwordless: GitHub OIDC exchanged for the fikar-acr-push identity, which holds AcrPush only.
# The AZURE_* repo secrets are identifiers, not credentials. deploy.yml (VPS) is unchanged.
#
# Config check (KAN-606): before anything is pushed, the built image's own config generator runs on
# the two production configs in tests/fikar/. An image that would reject them (as sha-0a3ff05 did
# with tracing.attribution_header) fails the run and never reaches the registry. Pull requests build
# and check without pushing. A manual run with `image` checks an image already in the registry
# instead of building; run it on main, the only ref the push identity trusts.
name: build-push

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: 'Check this registry image (e.g. fikaracr.azurecr.io/plano:sha-0a3ff05) instead of building'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: fikaracr.azurecr.io
  IMAGE_NAME: plano
  CHECK_TAG: plano:config-check

jobs:
  build-push:
    if: inputs.image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.CHECK_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the production configs
        run: tests/fikar/check-configs.sh "$CHECK_TAG"

      - uses: azure/login@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: az acr login --name "${REGISTRY%%.*}"

      - id: meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Same inputs as the checked build, so every layer comes from the builder's cache.
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  check-image:
    if: inputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the registry
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Check the production configs
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          docker pull "$IMAGE"
          tests/fikar/check-configs.sh "$IMAGE"
